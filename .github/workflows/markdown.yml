name: Markdown quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2@0.18.1 "formatted/**/*.md" "raw/**/*.md"
